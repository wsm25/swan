charon {
    load_modular = yes
    plugins {
        include strongswan.d/charon/*.conf
    }

    # Bump to "ike 4, enc 4, net 4" when diffing against swan/debug output.
    charondebug = "ike 2, cfg 2, enc 2, net 2"

    # Container-friendly logging: charon also writes its log to stdout.
    filelog {
        /dev/stdout {
            ike = 2
            cfg = 2
            enc = 2
            net = 2
            knl = 2
            asn = 1
            tls = 2
            eap = 2
            job = 1
        }
    }

    # Keep it test-friendly: retransmission and DPD are a bit faster.
    retransmit_base = 1
    retransmit_timeout = 4.0

    plugins {
        eap-radius {
            servers {
                main {
                    address = 127.0.0.1
                    secret = radius.rocks
                    auth_port = 1812
                }
            }
        }
    }
}

libradius {
    legacy_accounting = no
}