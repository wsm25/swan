# strongSwan responder profile for the fixed swan4 MVP deployment:
#   - initiator-only, NAT-T on 4500
#   - responder auth = pubkey, id @stu.vpn.sjtu.edu.cn
#   - initiator auth = EAP-PEAP (inner MSCHAPv2)
#   - CP-driven address assignment from rightsourceip
# Kept separate from the production config on purpose (test pool, test EAP user).

config setup
    strictcrlpolicy=no
    uniqueids=yes

conn swan4test
    left=%any
    leftsubnet=0.0.0.0/0
    leftcert=serverCert.pem
    leftsendcert=always
    leftauth=pubkey
    leftid=@stu.vpn.sjtu.edu.cn

    right=%any
    rightauth=eap-radius
    rightid=%any
    eap_identity=%any
    rightsendcert=never
    rightsourceip=10.31.0.0/24

    # Debian strongSwan ships the GCM/AESNI/OpenSSL plugins: exercise the
    # production MVP cipher profile locally.
    ike=aes256gcm16-prfsha512-curve25519!
    esp=aes256gcm16-prfsha512-curve25519!

    keyexchange=ikev2
    mobike=no
    fragmentation=yes
    auto=add